<!DOCTYPE html>

<head>

<title>For My Alya ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:'Poppins',sans-serif;overflow-x:hidden;min-height:100vh}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 20% 30%, #ff149344, transparent 40%), radial-gradient(circle at 80% 70%, #ffcc0033, transparent 40%), #0a0a0a}
.hearts{position:fixed;inset:0;z-index:1;pointer-events:none}
.heart-fall{position:absolute;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

.container{position:relative;z-index:2;max-width:500px;margin:0 auto;padding:20px;text-align:center}

.header{padding:40px 0 20px}
.header h1{font-family:'Great Vibes',cursive;font-size:70px;color:#ff7eb3;line-height:0.9}
.header h1 span{color:#ffcc00;display:block;font-size:80px;margin-top:5px;text-shadow:0 0 30px #ffcc00aa}
.names{margin:20px 0;font-size:18px;letter-spacing:4px;color:#ffcc00;font-weight:600}
.names b{color:#ff2d78}

.envelope-wrap{margin:30px auto;perspective:1000px;cursor:pointer}
.envelope{width:320px;height:200px;margin:0 auto;background:#1a1a1a;border:1px solid #ffffff22;border-radius:0 0 20px 20px;position:relative;transition:0.8s}
.envelope:before{content:"";position:absolute;top:-100px;left:0;width:0;height:0;border-left:160px solid transparent;border-right:160px solid transparent;border-bottom:100px solid #ff2d78;transform-origin:bottom;transition:0.8s;z-index:3}
.envelope.open:before{transform:rotateX(180deg);z-index:0}
